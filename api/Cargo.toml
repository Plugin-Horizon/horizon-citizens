[package]
name = "mod-citizens"
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"

[dependencies]
# The launcher points this at the Horizon source it builds the game from.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "a589a3dd9be04fa7f17667c0175711aaa92e1147" }
# Inside the [api] folder: the launcher stages only that folder.
horizon-citizens-core = { path = "core" }
# Skin lookups at Mojang, on a thread of their own. In Horizon's Cargo.lock.
ureq = "2"
