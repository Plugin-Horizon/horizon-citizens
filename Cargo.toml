[package]
name = "mod-citizens"
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Skin lookups at Mojang, on a thread of their own. In the engine's Cargo.lock (ureq 2.12.1).
ureq = "2"
# All three are in Horizon's Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

