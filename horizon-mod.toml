id = "citizens"
name = "Citizens"
version = "0.1.0"
description = "Citizens-compatible NPCs: saves.yml, look-close, clicks, /npc (clean-room port). Sentinel's NPC library."
authors = ["LionSpacer"]
api = "0.2"
side = "server"
capabilities = ["registries"]

# The economy (the vault mod) charges command and shop prices; PlaceholderAPI fills `papi(...)` in expressions. Both are
# optional: the launcher adds the Cargo alias and feature for each; do not declare them in Cargo.toml.
[dependencies]
vault = { version = "^0.1", optional = true }
placeholderapi = { version = "^0.1", optional = true }

[native]
# Development build of arismoko/horizon main plus mod API additions (see README).
game = "26.3"
horizon = "5ef7734fdd854add5efd6817178be3c988d8d050"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
